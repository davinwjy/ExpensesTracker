    <script>
      // Suppress Vite HMR WebSocket errors in AI Studio iframe environment
      (function() {
        if (typeof window !== 'undefined') {
          // 1. Suppress console.error logging from @vite/client
          var _origErr = console.error;
          console.error = function() {
            var msg = arguments[0] ? String(arguments[0]) : '';
            if (msg.includes('WebSocket') || msg.includes('[vite]') || msg.includes('vite-hmr')) {
              return;
            }
            _origErr.apply(console, arguments);
          };

          // 2. Intercept WebSocket if targeted at Vite HMR
          if (window.WebSocket) {
            var RealWebSocket = window.WebSocket;
            window.WebSocket = function(url, protocols) {
              var isVite = (typeof url === 'string' && (url.includes('vite') || url.includes('/@vite/client'))) ||
                           protocols === 'vite-hmr' ||
                           (Array.isArray(protocols) && protocols.includes('vite-hmr'));
              if (isVite) {
                var dummy = new EventTarget();
                dummy.readyState = 1; // OPEN
                dummy.bufferedAmount = 0;
                dummy.extensions = '';
                dummy.protocol = 'vite-hmr';
                dummy.binaryType = 'blob';
                dummy.url = url;
                dummy.send = function() {};
                dummy.close = function() {};
                dummy.onopen = null;
                dummy.onclose = null;
                dummy.onerror = null;
                dummy.onmessage = null;
                setTimeout(function() {
                  if (typeof dummy.onopen === 'function') dummy.onopen({ type: 'open' });
                  dummy.dispatchEvent(new Event('open'));
                }, 10);
                return dummy;
              }
              return new RealWebSocket(url, protocols);
            };
            window.WebSocket.prototype = RealWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }

          // 3. Catch any global error events referencing WebSocket
          window.addEventListener('error', function(event) {
            if (event && (
              (event.message && (event.message.includes('WebSocket') || event.message.includes('[vite]'))) ||
              (event.filename && event.filename.includes('@vite/client'))
            )) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            var reasonStr = event.reason ? (event.reason.message || String(event.reason)) : '';
            if (reasonStr.includes('WebSocket') || reasonStr.includes('[vite]')) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return true;
            }
          }, true);
        }

        // Ensure trailing slash for GitHub Pages repo subdirectories so relative ./assets resolve correctly
        if (window.location.pathname.slice(-1) !== '/' && !window.location.pathname.split('/').pop().includes('.')) {
          window.location.replace(window.location.pathname + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
