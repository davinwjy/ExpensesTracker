<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Subtle glow layer -->
  <circle cx="256" cy="256" r="140" fill="#10b981" opacity="0.15" filter="url(#glow)" />

  <!-- Main Wallet Shape -->
  <rect x="96" y="160" width="320" height="216" rx="36" fill="url(#primaryGrad)" filter="url(#glow)" />
  
  <!-- Wallet Flap / Back Layer -->
  <path d="M96 220 H 416 V 196 C 416 176 400 160 380 160 H 132 C 112 160 96 176 96 196 Z" fill="#047857" opacity="0.6" />

  <!-- Front Accent Card -->
  <rect x="120" y="128" width="272" height="64" rx="20" fill="url(#accentGrad)" opacity="0.9" />
  
  <!-- Growth Arrow Indicator -->
  <path d="M152 160 L 192 144 L 232 154 L 280 138" fill="none" stroke="#022c22" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="264,138 280,138 280,154" fill="none" stroke="#022c22" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Clasp / Lock Plate -->
  <rect x="300" y="232" width="128" height="72" rx="24" fill="#020617" stroke="#34d399" stroke-width="6" />
  <circle cx="364" cy="268" r="14" fill="#34d399" />
</svg>
